services:
  api:
    image: ghcr.io/selase17/invoiceflow-api:${IMAGE_TAG}
    build: !reset null
    ports:
      - "8081:3000"

  worker:
    image: ghcr.io/selase17/invoiceflow-worker:${IMAGE_TAG}
    build: !reset null

  frontend:
    image: ghcr.io/selase17/invoiceflow-frontend:${IMAGE_TAG}
    build: !reset null

  nginx:
    ports: !override
      - "8080:80"
      - "8443:443"
  jaeger:
    ports: !override
      - "16687:16686"
      - "4318:4317"
  grafana:
    ports: !override
      - "3002:3000"
  loki:
    ports: !override
      - "3101:3100"
  prometheus:
    ports: !override
      - "9091:9090"