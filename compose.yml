services:
  api:
    build: .
    image: invoiceflow-api:v1.0.0
    container_name: invoiceflow-api
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "3000:3000"
    env_file: .env
    networks: [public, private]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    image: invoiceflow-worker:v1.0.0
    container_name: invoiceflow-worker
    read_only: true
    tmpfs:
      - /tmp
    command: ["npm", "run", "start:worker"]
    env_file: .env
    networks: [public, private]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: invoiceflow-db
    environment:
      POSTGRES_DB: invoiceflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
    networks: [private]

  redis:
    image: redis:7-alpine
    container_name: invoiceflow-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    networks: [private]

  mailhog:
    image: mailhog/mailhog
    container_name: invoiceflow-mailhog
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025"]
      interval: 5s
      retries: 5
    networks: [public]

  # ── Observability stack ────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: invoiceflow-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [public, private]
    depends_on:
      - api

  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: invoiceflow-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    networks: [private]
    depends_on:
      redis:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: invoiceflow-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@db:5432/invoiceflow?sslmode=disable"
    networks: [private]
    depends_on:
      db:
        condition: service_healthy

  loki:
    image: grafana/loki:3.0.0
    container_name: invoiceflow-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks: [public, private]

  # Tails Docker container logs and ships them to Loki.
  # Needs the Docker socket to discover containers by name.
  promtail:
    image: grafana/promtail:3.0.0
    container_name: invoiceflow-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [private]
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.0.0
    container_name: invoiceflow-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks: [public, private]
    depends_on:
      - prometheus
      - loki

networks:
  public: {}
  private:
    internal: true

volumes:
  db_data:
  redis_data:
  prometheus_data:
  loki_data:
  grafana_data:
